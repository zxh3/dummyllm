[project]
name = "dummyllm"
version = "0.1.0"
description = "An OpenAI-compatible LLM server that only speaks cat. Meow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.scripts]
dummyllm = "dummyllm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "openai>=1.99",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dummyllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
